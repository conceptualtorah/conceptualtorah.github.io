<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conceptual Torah - Forum</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Clean container spacing for the embedded forum */
    .forum-container {
      max-width: 850px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
  </style>
</head>
<body>

  <!-- Dynamic Header Frame -->
  <div id="site-frame"></div>

  <main class="container">
    <section class="content-box">
      <h2>Community Forum</h2>
      <p>Engage in conceptual Torah study, discuss philosophical frameworks, and exchange ideas with the community.</p>
      
      <!-- Embedded Giscus Forum -->
      <div class="forum-container">
        <script src="https://giscus.app/client.js"
              data-repo="conceptualtorah/conceptualtorah.github.io"
              data-repo-id="R_kgDOVcu7Ng"
              data-category="General"
              data-category-id="DIC_kwDOVcu7Ns4DKeDP"
              data-mapping="pathname"
              data-strict="0"
              data-reactions-enabled="1"
              data-emit-metadata="0"
              data-input-position="top"
              data-theme="light"
              data-lang="en"
              crossorigin="anonymous"
              async>
        </script>
      </div>
    </section>
  </main>

  <!-- Script for Site Frame Header loading -->
  <script>
    fetch('frame.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('site-frame').innerHTML = html;
        const navForum = document.getElementById('nav-forum');
        if (navForum) navForum.classList.add('active');
      })
      .catch(err => console.log('frame.html loading bypassed or unavailable'));
  </script>
</body>
</html>
