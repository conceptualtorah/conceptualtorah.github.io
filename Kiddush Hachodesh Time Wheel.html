<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Zmanim Visualizer</title>
    <style>
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background-color: rgb(244, 244, 249); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h2 { color: rgb(51, 51, 51); margin-bottom: 10px; }
        .controls { margin-bottom: 10px; background: white; padding: 10px 20px; border-radius: 8px; box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 5px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; justify-content: center; }
        canvas { background-color: white; border-radius: 50%; box-shadow: rgba(0, 0, 0, 0.15) 0px 4px 15px; cursor: crosshair; }
        .legend { margin-top: 10px; font-size: 0.9em; color: rgb(85, 85, 85); max-width: 600px; text-align: center; line-height: 1.4; }
        .slider-container { width: 700px; margin-top: 15px; display: flex; align-items: center; gap: 10px; font-size: 0.9em; font-weight: bold; color: #333; }
        input[type="range"] { flex-grow: 1; }
        input[type="number"] { width: 60px; padding: 3px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 6px 15px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h2>Zmanim Visualizer</h2>
   
    <div class="controls">
        <label>
            <input type="checkbox" id="symmetricToggle" checked>
            <strong>Symmetric Mode:</strong> Moving Sun adjusts both sides
        </label>
        <div style="font-size: 0.9em; color: #666;">(Drag Yellow points to edit)</div>
    </div>

    <div class="controls">
        <label>Lat: <input type="number" id="latInput" value="40.7" step="0.1"></label>
        <label>Lng: <input type="number" id="lngInput" value="-74.0" step="0.1"></label>
        <label><input type="checkbox" id="dstToggle"> DST (+1h)</label>
        <button id="playBtn">▶ Play Year</button>
    </div>

    <canvas id="clockCanvas" width="700" height="700"></canvas>

    <div class="slider-container">
        <span>Jan 1</span>
        <input type="range" id="yearSlider" min="1" max="365" value="172">
        <span>Dec 31</span>
        <span id="dayLabel" style="min-width: 80px; text-align: right; color: #007bff;">Day: 172</span>
    </div>

    <div class="legend">
        <strong>Editable:</strong> Sunrise, Sunset, Chatzos (Noon/Midnight).<br>
        <strong>Calculated (Shaos Zmaniyos):</strong> Krias Shema (3h), Tefilla (4h), Mincha Gedola (6.5h), Mincha Ketana (9.5h), Plag (10.75h).
    </div>

<script>
const canvas = document.getElementById('clockCanvas');
const ctx = canvas.getContext('2d');
const centerX = canvas.width / 2;
const centerY = canvas.height / 2;
const radius = canvas.width / 2 - 55; // Slightly smaller radius to fit time labels

// Core state variables (Decimal hours)
let sunriseTime = 6.0;
let sunsetTime = 18.0;
let chatzosTime = 12.0;

// Calculated times variables
let kriasShema, tefilla, minchaGedola, minchaKetana, plagHamincha;

// Animation & UI states
let isPlaying = false;
let animationFrameId = null;
let draggedHandle = null; 

// DOM Elements
const symmetricToggle = document.getElementById('symmetricToggle');
const latInput = document.getElementById('latInput');
const lngInput = document.getElementById('lngInput');
const dstToggle = document.getElementById('dstToggle');
const playBtn = document.getElementById('playBtn');
const yearSlider = document.getElementById('yearSlider');
const dayLabel = document.getElementById('dayLabel');

// Helper to convert decimal hours to HH:MM format
function formatTime(decimalHours) {
    let h = Math.floor(decimalHours % 24);
    let m = Math.floor((decimalHours * 60) % 60);
    return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
}

// --- MATH & CALCULATIONS ENGINE (SHAOS ZMANIYOS RESTORED) ---
function calculateZmanimFromShaosZmaniyos() {
    let dayLength = sunsetTime - sunriseTime;
    if (dayLength < 0) dayLength += 24; 
    let shaaZmanis = dayLength / 12; // Proportional hour length (Shaos Zmaniyos)

    kriasShema = (sunriseTime + shaaZmanis * 3) % 24;
    tefilla = (sunriseTime + shaaZmanis * 4) % 24;
    minchaGedola = (sunriseTime + shaaZmanis * 6.5) % 24;
    minchaKetana = (sunriseTime + shaaZmanis * 9.5) % 24;
    plagHamincha = (sunriseTime + shaaZmanis * 10.75) % 24;
}

function getSolarOrbitTimes(dayOfYear, lat, lng, dstCheckboxChecked) {
    const declination = 23.45 * Math.sin((2 * Math.PI / 365) * (284 + dayOfYear));
    const declRad = (declination * Math.PI) / 180;
    const latRad = (lat * Math.PI) / 180;

    let cosH = -Math.tan(latRad) * Math.tan(declRad);
    cosH = Math.max(-1, Math.min(1, cosH)); 
    const hourAngleRad = Math.acos(cosH);
    const dayLengthHours = (hourAngleRad * 2) * (12 / Math.PI);

    const B = (2 * Math.PI / 365) * (dayOfYear - 81);
    const eqOfTime = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);

    const lngTimeZoneStandard = Math.round(lng / 15) * 15;
    const lngCorrection = (lngTimeZoneStandard - lng) / 15;
    
    let chatzos = 12.0 + lngCorrection - (eqOfTime / 60);
    
    if (dstCheckboxChecked && dayOfYear >= 85 && dayOfYear <= 300) {
        chatzos += 1.0;
    }

    let sunrise = chatzos - (dayLengthHours / 2);
    let sunset = chatzos + (dayLengthHours / 2);

    return {
        sunrise: (sunrise + 24) % 24,
        sunset: (sunset + 24) % 24,
        chatzos: (chatzos + 24) % 24
    };
}

function syncFromOrbit() {
    const day = parseInt(yearSlider.value);
    dayLabel.innerText = "Day: " + day;
    const times = getSolarOrbitTimes(day, parseFloat(latInput.value), parseFloat(lngInput.value), dstToggle.checked);
    
    sunriseTime = times.sunrise;
    sunsetTime = times.sunset;
    chatzosTime = times.chatzos;

    calculateZmanimFromShaosZmaniyos();
    drawClock();
}

// --- CANVAS RENDERING PIPELINE ---

function hourToRad(h) {
    return ((h - 12) * (2 * Math.PI / 24)) - (Math.PI / 2);
}

function radToHour(rad) {
    let normalized = (rad + Math.PI / 2) % (2 * Math.PI);
    if (normalized < 0) normalized += (2 * Math.PI);
    return (normalized * (24 / (2 * Math.PI)) + 12) % 24;
}

function drawTimeLine(time, color, label, isHandle = false) {
    const angle = hourToRad(time);
    const xOuter = centerX + radius * Math.cos(angle);
    const yOuter = centerY + radius * Math.sin(angle);

    ctx.strokeStyle = color;
    ctx.lineWidth = isHandle ? 3 : 1.5;
    ctx.setLineDash([]); 
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(xOuter, yOuter);
    ctx.stroke();

    if (isHandle) {
        ctx.fillStyle = '#ffc107';
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(xOuter, yOuter, 8, 0, 2 * Math.PI);
        ctx.fill();
        ctx.stroke();
    }

    const fullLabel = `${label} (${formatTime(time)})`;

    ctx.fillStyle = '#222';
    ctx.font = 'bold 10px sans-serif';
    const textDist = radius + 22;
    const lx = centerX + textDist * Math.cos(angle);
    const ly = centerY + textDist * Math.sin(angle);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(fullLabel, lx, ly);
}

function drawClock() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw outer 24-Hour track
    ctx.strokeStyle = '#bbb';
    ctx.lineWidth = 3;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
    ctx.stroke();

    // Night Shading Segment
    ctx.fillStyle = 'rgba(25, 30, 60, 0.08)';
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.arc(centerX, centerY, radius, hourToRad(sunsetTime), hourToRad(sunriseTime));
    ctx.closePath();
    ctx.fill();

    // 12 DAYTIME HOURS DIVISION LINES (Shaos Zmaniyos Segments)
    let dayLength = sunsetTime - sunriseTime;
    if (dayLength < 0) dayLength += 24;
    let shaaZmanis = dayLength / 12;

    ctx.strokeStyle = 'rgba(255, 152, 0, 0.35)'; 
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]); 
    for (let seg = 1; seg < 12; seg++) {
        let segTime = (sunriseTime + shaaZmanis * seg) % 24;
        let segAngle = hourToRad(segTime);
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + radius * Math.cos(segAngle), centerY + radius * Math.sin(segAngle));
        ctx.stroke();
    }
    ctx.setLineDash([]); 

    // ALL 24 HOUR DIAL MARKERS
    ctx.fillStyle = '#666';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let h = 0; h < 24; h++) {
        const a = hourToRad(h);
        const tx = centerX + (radius - 14) * Math.cos(a);
        const ty = centerY + (radius - 14) * Math.sin(a);
        
        ctx.font = (h % 6 === 0) ? 'bold 10px sans-serif' : '9px sans-serif';
        ctx.fillText(h + "h", tx, ty);
    }

    // Render calculated dependent markers (Shaos Zmaniyos based)
    drawTimeLine(kriasShema, '#28a745', 'Shema');
    drawTimeLine(tefilla, '#fd7e14', 'Tefilla');
    drawTimeLine(minchaGedola, '#dc3545', 'M. Gedola');
    drawTimeLine(minchaKetana, '#6f42c1', 'M. Ketana');
    drawTimeLine(plagHamincha, '#e83e8c', 'Plag');

    // Render editable control vectors
    drawTimeLine(sunriseTime, '#ff9800', 'Sunrise', true);
    drawTimeLine(sunsetTime, '#ff5722', 'Sunset', true);
    drawTimeLine(chatzosTime, '#2196f3', 'Chatzos', true);
}

// --- INTERACTIVE DRAG HOOKS ---
function getMousePosition(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas.addEventListener('mousedown', (e) => {
    const pos = getMousePosition(e);
    
    function hitTest(time) {
        const a = hourToRad(time);
        const hx = centerX + radius * Math.cos(a);
        const hy = centerY + radius * Math.sin(a);
        return Math.hypot(pos.x - hx, pos.y - hy) < 18;
    }

    if (hitTest(sunriseTime)) draggedHandle = 'sunrise';
    else if (hitTest(sunsetTime)) draggedHandle = 'sunset';
    else if (hitTest(chatzosTime)) draggedHandle = 'chatzos';

    if (draggedHandle && isPlaying) {
        playBtn.click(); 
    }
});

canvas.addEventListener('mousemove', (e) => {
    if (!draggedHandle) return;

    const pos = getMousePosition(e);
    const rad = Math.atan2(pos.y - centerY, pos.x - centerX);
    let newHour = radToHour(rad);

    if (draggedHandle === 'sunrise') {
        if (symmetricToggle.checked) {
            let diff = chatzosTime - newHour;
            sunriseTime = newHour;
            sunsetTime = (chatzosTime + diff + 24) % 24;
        } else {
            sunriseTime = newHour;
        }
    } else if (draggedHandle === 'sunset') {
        if (symmetricToggle.checked) {
            let diff = newHour - chatzosTime;
            sunsetTime = newHour;
            sunriseTime = (chatzosTime - diff + 24) % 24;
        } else {
            sunsetTime = newHour;
        }
    } else if (draggedHandle === 'chatzos') {
        let offset = newHour - chatzosTime;
        chatzosTime = newHour;
        sunriseTime = (sunriseTime + offset + 24) % 24;
        sunsetTime = (sunsetTime + offset + 24) % 24;
    }

    calculateZmanimFromShaosZmaniyos();
    drawClock();
});

window.addEventListener('mouseup', () => { draggedHandle = null; });

// --- ANIMATION INTERACTION HANDLERS ---
function animationStep() {
    let currentDay = parseInt(yearSlider.value);
    currentDay++;
    if (currentDay > 365) currentDay = 1;
    yearSlider.value = currentDay;
    
    syncFromOrbit();

    if (isPlaying) {
        animationFrameId = requestAnimationFrame(animationStep);
    }
}

playBtn.addEventListener('click', () => {
    isPlaying = !isPlaying;
    if (isPlaying) {
        playBtn.innerText = "⏸ Pause";
        animationStep();
    } else {
        playBtn.innerText = "▶ Play Year";
        cancelAnimationFrame(animationFrameId);
    }
});

// Wire setup changes
yearSlider.addEventListener('input', syncFromOrbit);
latInput.addEventListener('input', syncFromOrbit);
lngInput.addEventListener('input', syncFromOrbit);
dstToggle.addEventListener('change', syncFromOrbit);
symmetricToggle.addEventListener('change', drawClock);

// Initial execution
calculateZmanimFromShaosZmaniyos();
syncFromOrbit();
</script>
</body>
</html>
