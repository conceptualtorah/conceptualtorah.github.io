<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conceptual Torah - Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Shared Frame Injected Here -->
  <div id="site-frame"></div>

  <main class="container">
    <section class="content-box home-hero">
      <h2>Welcome to Conceptual Torah</h2>
      <p>Multimedia for Achieving Mastery of Complex and <b>Conceptual Torah</b> Concepts</p>
      <div class="placeholder-image">Landing Page Image Placecard</div>
    </section>
  </main>

  <script>
    fetch('frame.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('site-frame').innerHTML = html;
        document.getElementById('nav-home').classList.add('active');
      });
  </script>
</body>
</html>
